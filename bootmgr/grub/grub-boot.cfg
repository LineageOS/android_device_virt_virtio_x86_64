submenu 'Advanced options (virtio_x86_64 specific)' --class format-list-bulleted {
	menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ ${kernel_version_display} (AMD GCN and later GPU, Swiftshader graphics)" {
		pre_boot_hook
		echo 'Loading kernel...'
		linux ${boot_partition}/kernel $kernel_cmdline_boot $kernel_cmdline_dynamic androidboot.graphics=swiftshader_amdgpu virtio_gpu.modeset=0 androidboot.selinux=permissive
		echo 'Loading ramdisk...'
		initrd ${boot_partition}/${boot_ramdisk_filename}
	}

	menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ ${kernel_version_display} (Intel Pre-Broadwell GPU, Mesa graphics)" {
		pre_boot_hook
		echo 'Loading kernel...'
		linux ${boot_partition}/kernel $kernel_cmdline_boot $kernel_cmdline_dynamic androidboot.graphics=mesa_i915 virtio_gpu.modeset=0 androidboot.selinux=permissive
		echo 'Loading ramdisk...'
		initrd ${boot_partition}/${boot_ramdisk_filename}
	}

	menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ ${kernel_version_display} (Intel Pre-Broadwell GPU, Swiftshader graphics)" {
		pre_boot_hook
		echo 'Loading kernel...'
		linux ${boot_partition}/kernel $kernel_cmdline_boot $kernel_cmdline_dynamic androidboot.graphics=swiftshader_i915 virtio_gpu.modeset=0 androidboot.selinux=permissive
		echo 'Loading ramdisk...'
		initrd ${boot_partition}/${boot_ramdisk_filename}
	}
}
